      - name: Extract Resolutions (144p - 720p) and Build Master M3U8
        run: |
          mkdir -p "smil:bernama/pass:bernama24"
          TARGET_FILE="smil:bernama/pass:bernama24/playlist.m3u8"

          YT_URL="https://www.youtube.com/live/eGD2SjmivoI"

          # Ekstrak URL stream bagi setiap format (ambil baris pertama sahaja untuk elak limpahan multiline)
          URL_95=$(yt-dlp --cookies cookies.txt --js-runtimes deno -g -f 95 "$YT_URL" 2>/dev/null | head -n 1 || true)
          URL_94=$(yt-dlp --cookies cookies.txt --js-runtimes deno -g -f 94 "$YT_URL" 2>/dev/null | head -n 1 || true)
          URL_93=$(yt-dlp --cookies cookies.txt --js-runtimes deno -g -f 93 "$YT_URL" 2>/dev/null | head -n 1 || true)
          URL_92=$(yt-dlp --cookies cookies.txt --js-runtimes deno -g -f 92 "$YT_URL" 2>/dev/null | head -n 1 || true)
          URL_91=$(yt-dlp --cookies cookies.txt --js-runtimes deno -g -f 91 "$YT_URL" 2>/dev/null | head -n 1 || true)

          # Mula bina Master M3U8
          echo "#EXTM3U" > "$TARGET_FILE"
          echo "#EXT-X-VERSION:3" >> "$TARGET_FILE"

          # 720p (Keutamaan Pertama)
          if [ -n "$URL_95" ] && [[ "$URL_95" == http* ]]; then
            echo '#EXT-X-STREAM-INF:BANDWIDTH=2800000,RESOLUTION=1280x720' >> "$TARGET_FILE"
            echo "$URL_95" >> "$TARGET_FILE"
          fi

          # 480p
          if [ -n "$URL_94" ] && [[ "$URL_94" == http* ]]; then
            echo '#EXT-X-STREAM-INF:BANDWIDTH=1400000,RESOLUTION=854x480' >> "$TARGET_FILE"
            echo "$URL_94" >> "$TARGET_FILE"
          fi

          # 360p
          if [ -n "$URL_93" ] && [[ "$URL_93" == http* ]]; then
            echo '#EXT-X-STREAM-INF:BANDWIDTH=800000,RESOLUTION=640x360' >> "$TARGET_FILE"
            echo "$URL_93" >> "$TARGET_FILE"
          fi

          # 240p
          if [ -n "$URL_92" ] && [[ "$URL_92" == http* ]]; then
            echo '#EXT-X-STREAM-INF:BANDWIDTH=400000,RESOLUTION=426x240' >> "$TARGET_FILE"
            echo "$URL_92" >> "$TARGET_FILE"
          fi

          # 144p
          if [ -n "$URL_91" ] && [[ "$URL_91" == http* ]]; then
            echo '#EXT-X-STREAM-INF:BANDWIDTH=200000,RESOLUTION=256x144' >> "$TARGET_FILE"
            echo "$URL_91" >> "$TARGET_FILE"
          fi
          
