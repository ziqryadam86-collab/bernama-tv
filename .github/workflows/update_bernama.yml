name: Auto Update 480p Stream (Bernama TV)

on:
  schedule:
    # Berjalan secara automatik setiap 5 minit
    - cron: '*/5 * * * *'
  # Membenarkan anda tekan butang "Run workflow" secara manual
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Deno & yt-dlp
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "/home/runner/.deno/bin" >> $GITHUB_PATH

          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Setup Cookies File
        env:
          COOKIES_DATA: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "$COOKIES_DATA" > cookies.txt

      - name: Extract Direct 480p Stream URL
        run: |
          mkdir -p "smil:bernama/pass:bernama24"
          TARGET_FILE="smil:bernama/pass:bernama24/playlist.m3u8"

          YT_URL="https://www.youtube.com/live/eGD2SjmivoI"

          # Ekstrak URL direct 480p (itag 94)
          URL_480=$(yt-dlp --cookies cookies.txt --js-runtimes deno -g -f 94 "$YT_URL" 2>/dev/null | head -n 1 || true)

          # Backup jika itag 94 gagal atau bukan pautan http
          case "$URL_480" in
            http*)
              ;;
            *)
              URL_480=$(yt-dlp --cookies cookies.txt --js-runtimes deno -g -f "b" "$YT_URL" 2>/dev/null | head -n 1 || true)
              ;;
          esac

          # Tulis M3U8 berserta tag STREAM-INF wajib untuk 480p
          echo "#EXTM3U" > "$TARGET_FILE"
          echo "#EXT-X-VERSION:3" >> "$TARGET_FILE"
          echo '#EXT-X-STREAM-INF:BANDWIDTH=1400000,RESOLUTION=854x480' >> "$TARGET_FILE"
          echo "$URL_480" >> "$TARGET_FILE"

      - name: Commit and Push to Github
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "smil:bernama/pass:bernama24/playlist.m3u8"
          git commit -m "Auto update 480p stream URL [skip ci]" || exit 0
          git push
          
